@if (providers(); as list) {
  @if (list.length === 0) {
    <p class="text-sm text-zinc-500">
      No API key yet.
      <a routerLink="/api-keys" class="font-medium text-indigo-600 hover:text-indigo-700">Add one</a>
      to use the AI.
    </p>
  } @else {
    <div class="flex flex-col gap-3 sm:flex-row">
      <!-- Native select (keyboard + mobile friendly); options cannot hold images, so the logo of the chosen provider sits inside the field. -->
      <div class="relative sm:w-56">
        @if (currentProvider(); as current) {
          <img [src]="current.logo" alt="" class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2" />
        }
        <label class="sr-only" for="provider-select">Provider</label>
        <select
          id="provider-select"
          (change)="chooseProvider($any($event.target).value)"
          class="w-full rounded-lg border border-zinc-300 bg-white py-2 pr-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
          [class]="currentProvider() ? 'pl-9' : 'pl-3'"
        >
          <option value="" disabled [selected]="!provider()">Choose a provider</option>
          @for (p of list; track p.id) {
            <option [value]="p.id" [selected]="provider() === p.id">{{ p.name }} · {{ p.vendor }}</option>
          }
        </select>
      </div>
      <label class="sr-only" for="model-select">Model</label>
      <select
        id="model-select"
        [disabled]="!provider() || loadingModels()"
        (change)="chooseModel($any($event.target).value)"
        class="min-w-0 flex-1 rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 disabled:bg-zinc-50 disabled:text-zinc-400"
      >
        <option value="" [selected]="!selection()">
          {{ !provider() ? 'Pick a provider first' : loadingModels() ? 'Loading models…' : 'Choose a model' }}
        </option>
        @for (m of models(); track m.id) {
          <option [value]="m.id" [selected]="selection()?.model === m.id">{{ m.name }}</option>
        }
      </select>
    </div>
  }
} @else if (!error()) {
  <p class="text-sm text-zinc-400">Loading providers…</p>
}
@if (error(); as e) {
  <p role="alert" class="mt-2 text-sm text-red-600">{{ e }}</p>
}
