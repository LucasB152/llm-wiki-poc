services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: llmwiki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d llmwiki"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./llm_wiki_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wiki:wiki@db:5432/llmwiki
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "3000:3000"
